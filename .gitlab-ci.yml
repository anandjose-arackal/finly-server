default:
  image: ruby:2.6
  before_script:
    - apt-get update
    - apt-get install -y sqlite3 libsqlite3-dev nodejs
    - ruby -v
    - which ruby
    - gem install bundler --no-document
    - gem install rubocop-rails
    # - bundle install --jobs $(nproc) "${FLAGS[@]}"

rubocop:
  script:
    - rubocop --require rubocop-rails
