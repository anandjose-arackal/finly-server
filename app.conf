[program:app-sidekiq-1]
command=RAILS_ENV=production bundle exec sidekiq -d log/sidekiq.log
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/app/sidekiq-1.log
stderr_logfile=/var/log/app/sidekiq-1.error.log
user=app
directory=/Users/vivekag/Projects/Rails/finly-server
environment=PORT="5000"

[program:app-crono-1]
command=RAILS_ENV=production bundle exec crono start
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/app/crono-1.log
stderr_logfile=/var/log/app/crono-1.error.log
user=app
directory=/Users/vivekag/Projects/Rails/finly-server
environment=PORT="5100"

[program:app-transactions_queue-1]
command=RAILS_ENV=production nohup rails runner TransactionsMsgQueuePoller.run > log/transactions_msg_queue_poller.log &
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/app/transactions_queue-1.log
stderr_logfile=/var/log/app/transactions_queue-1.error.log
user=app
directory=/Users/vivekag/Projects/Rails/finly-server
environment=PORT="5200"

[program:app-balance_queue-1]
command=RAILS_ENV=production nohup rails runner BalanceMsgQueuePoller.run > log/balance_msg_queue_poller.log &
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/app/balance_queue-1.log
stderr_logfile=/var/log/app/balance_queue-1.error.log
user=app
directory=/Users/vivekag/Projects/Rails/finly-server
environment=PORT="5300"

[group:app]
programs=app-sidekiq-1,app-crono-1,app-transactions_queue-1,app-balance_queue-1
