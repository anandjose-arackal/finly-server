require: rubocop-rails

AllCops:
  Exclude:
    - db/schema.rb
    - db/migrate/*

Style/RedundantSelf:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/EmptyMethod:
  EnforcedStyle: expanded

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/Lambda:
  Enabled: false

Layout/EndOfLine:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Rails/Blank:
  Enabled: false

Lint/UselessAssignment:
  Enabled: false

Rails/HasManyOrHasOneDependent:
  Enabled: false

Lint/UnusedBlockArgument:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Lint/SafeNavigationChain:
  Enabled: false

Rails/Date:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Style/LambdaCall:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Rails/DynamicFindBy:
  Enabled: false

Rails/Output:
  Enabled: false

Rails/InverseOf:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Naming/PredicateName:
  Enabled: false

Rails/Present:
  Enabled: false

Rails/FilePath:
  Enabled: false

Lint/NonLocalExitFromIterator:
  Enabled: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/WordArray:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Lint/IneffectiveAccessModifier:
  Enabled: false

Style/PreferredHashMethods:
  Enabled: false

Rails/TimeZone:
  Enabled: false

Rails/Presence:
  Enabled: false

Rails/ActiveRecordAliases:
  Enabled: false

Style/SymbolProc:
  Enabled: false

Style/IfInsideElse:
  Enabled: false

Style/SignalException:
  Enabled: false

Lint/ShadowingOuterLocalVariable:
  Enabled: false

Lint/DuplicateMethods:
  Enabled: false

Style/ClassCheck:
  Enabled: false

Rails/Delegate:
  Enabled: false

Style/UnlessElse:
  Enabled: false